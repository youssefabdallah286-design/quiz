<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>كلمات إيطالية</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #eef1f4;
            --surface: #ffffff;
            --ink: #16202e;
            --muted: #5d6b7c;
            --line: #d9dfe6;
            --accent: #1d6f54;
            --accent-soft: #e2f1ea;
            --focus: #2456d6;
            --on-accent: #ffffff;
            --serif: "Newsreader", Georgia, "Times New Roman", serif;
            --sans: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #10161e;
                --surface: #19212c;
                --ink: #e8edf3;
                --muted: #93a1b3;
                --line: #2a3542;
                --accent: #55c49b;
                --accent-soft: #163a2e;
                --focus: #7ea2ff;
                --on-accent: #0c1712;
            }
        }

        * { box-sizing: border-box; }

        html { scroll-padding-top: 150px; }

        body {
            margin: 0;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            line-height: 1.6;
        }

        .wrap {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 16px 48px;
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            padding: 20px 0 12px;
            border-bottom: 1px solid var(--line);
        }

        .top h1 {
            margin: 0 0 12px;
            font-size: 1.35rem;
            font-weight: 600;
        }

        .search {
            width: 100%;
            padding: 11px 14px;
            font: inherit;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .search::placeholder { color: var(--muted); }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .tab {
            font: inherit;
            font-size: .9rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 5px 14px;
            cursor: pointer;
        }

        .tab[aria-pressed="true"] {
            color: var(--surface);
            background: var(--ink);
            border-color: var(--ink);
        }

        .group-title {
            margin: 26px 0 8px;
            font-family: var(--serif);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent);
            direction: ltr;
            text-align: right;
        }

        .card {
            display: flex;
            align-items: flex-start;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .card[hidden] { display: none !important; }

        .reveal {
            flex: 1;
            min-width: 0;
            font: inherit;
            color: inherit;
            text-align: start;
            background: none;
            border: 0;
            padding: 12px 16px;
            cursor: pointer;
            border-radius: 10px;
        }

        .word-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .word-main { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .pos {
            font-family: var(--sans);
            font-size: .72rem;
            font-weight: 500;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 1px 9px;
            white-space: nowrap;
        }
        .pos.verb { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

        .conj { display: block; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
        .conj-title { display: block; color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
        .conj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; direction: ltr; }
        .conj-cell { display: block; background: var(--bg); border-radius: 8px; padding: 6px 10px; text-align: left; }
        .conj-cell small { display: block; color: var(--muted); font-size: .72rem; }
        .conj-cell b { font-family: var(--serif); font-size: 1.02rem; font-weight: 500; }

        .word {
            direction: ltr;
            text-align: right;
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 500;
        }

        .meaning {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .2s ease;
        }

        .meaning > span {
            overflow: hidden;
            color: var(--accent);
            font-weight: 500;
        }

        .ex, .ex-tr { display: block; }
        .ex {
            direction: ltr;
            text-align: right;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--line);
            color: var(--ink);
            font-family: var(--serif);
            font-size: 1.05rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ex-tr { color: var(--muted); font-weight: 400; font-size: .92rem; }

        .card.open .meaning { grid-template-rows: 1fr; }
        .card.open .meaning > span { padding-top: 4px; }

        .actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 8px;
        }

        .btn-icon, .save {
            font: inherit;
            font-size: .85rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover, .save:hover { border-color: var(--accent); color: var(--accent); }

        .save[aria-pressed="true"] {
            color: var(--accent);
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 0;
        }

        [hidden] { display: none !important; }

        .quiz-start {
            margin-inline-start: auto;
            font: inherit;
            font-size: .9rem;
            font-weight: 500;
            color: var(--on-accent);
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 5px 16px;
            cursor: pointer;
        }

        .quiz { padding-top: 22px; }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 8px;
        }

        .quiz-exit {
            font: inherit;
            font-size: .85rem;
            color: var(--muted);
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 3px 10px;
            cursor: pointer;
        }

        .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
        .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

        .q-word-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 34px 0 4px;
        }

        .q-word {
            direction: ltr;
            text-align: center;
            font-family: var(--serif);
            font-size: 2.6rem;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .q-hint { text-align: center; color: var(--muted); margin: 0 0 22px; }

        .options { display: grid; gap: 10px; }

        .opt {
            font: inherit;
            font-size: 1.05rem;
            color: var(--ink);
            text-align: start;
            background: var(--surface);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
        }

        .opt:hover:not(:disabled) { border-color: var(--accent); }
        .opt:disabled { cursor: default; }

        .opt.right {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .opt.wrong {
            background: #fbe4e4;
            border-color: #c23b3b;
            color: #9b2222;
        }

        .feedback { min-height: 1.6em; margin: 14px 0 0; font-weight: 500; text-align: center; }

        .btn-primary, .btn-ghost {
            font: inherit;
            font-weight: 500;
            border-radius: 10px;
            padding: 11px 20px;
            cursor: pointer;
        }

        .btn-primary { background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); }
        .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

        .next-row { display: flex; justify-content: center; margin-top: 10px; }

        .result { text-align: center; padding-top: 18px; }
        .score-big { font-family: var(--serif); font-size: 4rem; font-weight: 600; line-height: 1.1; margin: 10px 0 0; }
        .score-sub { color: var(--muted); margin: 4px 0 6px; }
        .score-msg { font-weight: 600; color: var(--accent); margin: 0 0 22px; }
        .result-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 26px; }

        .mistakes { text-align: start; }
        .mistakes h3 { font-size: 1rem; margin: 0 0 8px; }
        .mistake {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 6px;
        }
        .mistake .w { direction: ltr; text-align: right; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
        .mistake .ok { color: var(--accent); }
        .mistake .no { color: #c23b3b; text-decoration: line-through; }

        .modes { display: flex; gap: 6px; margin-bottom: 10px; }
        .mode { flex: 1; font: inherit; font-weight: 500; color: var(--muted); background: var(--surface);
                border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; }
        .mode[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }

        .fpanel { margin-top: 10px; background: var(--surface); border: 1px solid var(--line);
                  border-radius: 10px; padding: 10px 12px; max-height: 42vh; overflow: auto; }
        .fl { display: block; color: var(--muted); font-size: .8rem; margin: 8px 0 4px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { font: inherit; font-size: .85rem; color: var(--ink); background: transparent;
                border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
        .chip[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
        .chip.off { opacity: .45; }
        .frow { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: .85rem; }
        .link-btn { font: inherit; font-size: .85rem; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; }

        .stories { padding-top: 14px; }
        .lvl-note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
        .story { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
        .story h2 { margin: 0; direction: ltr; text-align: right; font-family: var(--serif); font-size: 1.5rem; }
        .story .t-ar { color: var(--muted); margin: 0 0 12px; }
        .sp { padding: 10px 0; border-top: 1px dashed var(--line); }
        .s-it { direction: ltr; text-align: left; font-family: var(--serif); font-size: 1.15rem; margin: 0; }
        .s-ar { color: var(--muted); margin: 4px 0 0; }
        .story h3 { margin: 16px 0 8px; font-size: 1rem; color: var(--accent); }
        .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
        .vw { background: var(--bg); border-radius: 8px; padding: 6px 10px; }
        .vw b { display: block; direction: ltr; text-align: left; font-family: var(--serif); font-weight: 500; }
        .vw span { color: var(--muted); font-size: .9rem; }
    </style>
</head>

<body>
    <div class="wrap">
        <header class="top">
            <h1>كلمات إيطالية</h1>
            <div class="modes">
                <button type="button" class="mode" id="mode-words" aria-pressed="true">الكلمات</button>
                <button type="button" class="mode" id="mode-stories" aria-pressed="false">القصص</button>
            </div>
            <input id="search" class="search" type="search" placeholder="ابحث بالإيطالي أو بالعربي" autocomplete="off">
            <div class="tabs">
                <button type="button" class="tab" id="tab-all" aria-pressed="true">كل الكلمات</button>
                <button type="button" class="tab" id="tab-saved" aria-pressed="false">المحفوظات</button>
                <button type="button" class="tab" id="filter-toggle" aria-expanded="false">تصفية</button>
                <button type="button" class="quiz-start" id="start-quiz" hidden>ابدأ اختبارًا من المحفوظات</button>
            </div>
            <div id="fpanel" class="fpanel" hidden>
                <span class="fl">الحرف (اختر واحدًا أو أكثر)</span><div id="f-letters" class="chips"></div>
                <span class="fl">نوع الكلمة</span><div id="f-pos" class="chips"></div>
                <div class="frow"><span id="fcount"></span><button type="button" class="link-btn" id="fclear">مسح التصفية</button></div>
            </div>
        </header>

        <main id="word-container"></main>
        <p id="empty" class="empty" hidden></p>
        <section id="quiz" class="quiz" hidden aria-live="polite"></section>
        <section id="stories" class="stories" hidden></section>
    </div>

    <script>

                    return [stem + (s ? 'isco' : 'o'), stem + (s ? 'isci' : 'i'), stem + (s ? 'isce' : 'e'),
                            stem + 'iamo', stem + 'ite', stem + (s ? 'iscono' : 'ono')];
                }
                return null;
            }

            const PRONOUNS = ['io', 'tu', 'lui/lei', 'noi', 'voi', 'loro'];

            function buildConj(forms) {
                const box = el('span', 'conj');

                forms.forEach((f, i) => {
                    const cell = el('span', 'conj-cell');
                    cell.appendChild(el('small', '', PRONOUNS[i]));
                    const b = el('b', '', f);
                    b.lang = 'it';
                    cell.appendChild(b);
                    grid.appendChild(cell);
                });
                box.appendChild(grid);
                return box;
            }

            const words = [...italianWords].sort((a, b) => a.word.localeCompare(b.word, 'it'));
            const entries = [];
            let currentLetter = '';
            let currentTitle = null;

            words.forEach(item => {
                const letter = item.word[0].toUpperCase();

                if (letter !== currentLetter) {
                    currentLetter = letter;
                    currentTitle = el('h2', 'group-title', letter);
                    container.appendChild(currentTitle);
                }

                const card = el('div', 'card');

                const reveal = el('button', 'reveal');

                reveal.setAttribute('aria-expanded', 'false');

                const wordEl = el('span', 'word', item.word);
                wordEl.lang = 'it';
                const pos = posOf(item);
                const posTag = el('span', pos === 'فعل' ? 'pos verb' : 'pos', pos);
                const wordMain = el('span', 'word-main');
                wordMain.append(wordEl, posTag);
                wordRow.appendChild(wordMain);

                const meaning = el('span', 'meaning');

                if (pos === 'فعل') {

                reveal.addEventListener('click', () => {

                save.addEventListener('click', () => {
                    if (saved.has(item.word)) saved.delete(item.word);

                    paintSave(entry);
                    applyFilters();
                });

                const entry = {
                    item, card, save, title: currentTitle, letter, pos,

                entries.push(entry);

            function paintSave(entry) {
                const isSaved = saved.has(entry.item.word);

            const selLetters = new Set(), selPos = new Set();

            function applyFilters() {
                const q = normalize(searchInput.value.trim());
                const visibleTitles = new Set();

                entries.forEach(e => {

            // ---------- القصص ----------

                house: { A1: ["La mia casa", "بيتي", [["La mia casa è piccola ma bella.", "بيتي صغير لكنه جميل."], ["Ha due camere, una cucina e un bagno.", "فيه غرفتان ومطبخ وحمّام."], ["Il balcone ha una vista sul mare.", "الشرفة تطل على البحر."]], [["Camera", "غرفة"], ["Cucina", "مطبخ"], ["Bagno", "حمّام"], ["Balcone", "شرفة"]]] },

                space: { A1: ["Lo spazio", "الفضاء", [["La luna è vicina alla Terra.", "القمر قريب من الأرض."], ["Il sole è una grande stella.", "الشمس نجمة كبيرة."], ["Di notte guardo le stelle dal balcone.", "في الليل أنظر إلى النجوم من الشرفة."]], [["Luna", "قمر"], ["Terra", "أرض"], ["Stella", "نجمة"], ["Sole", "شمس"]]] },

                tech: { A1: ["Il mio telefono", "هاتفي", [["Uso il telefono ogni giorno.", "أستخدم الهاتف كل يوم."], ["Mando messaggi e guardo video su internet.", "أرسل رسائل وأشاهد فيديوهات على الإنترنت."], ["La batteria finisce presto!", "البطارية تنتهي بسرعة!"]], [["Telefono", "هاتف"], ["Messaggio", "رسالة"], ["Batteria", "بطارية"], ["Internet", "الإنترنت"]]] }
            };

            const storiesEl = document.getElementById('stories');
            const modeWords = document.getElementById('mode-words');
            const modeStories = document.getElementById('mode-stories');
            let curTopic = 'me', curLevel = 'A1';

            function chipRow(items, isOn, onPick, extra) {
                const row = el('div', 'chips');
                items.forEach(([id, label]) => {
                    const b = el('button', 'chip' + (extra && extra(id) ? ' off' : ''), label);
                    b.type = 'button';
                    b.setAttribute('aria-pressed', String(isOn(id)));
                    b.addEventListener('click', () => onPick(id));
                    row.appendChild(b);
                });
                return row;
            }

            function renderStories() {
                storiesEl.replaceChildren();
                storiesEl.appendChild(el('span', 'fl', 'الموضوع'));
                storiesEl.appendChild(chipRow(TOPICS, id => id === curTopic, id => { curTopic = id; renderStories(); }));
                storiesEl.appendChild(el('span', 'fl', 'المستوى'));
                storiesEl.appendChild(chipRow(LEVELS.map(([l]) => [l, l]), id => id === curLevel,
                    id => { curLevel = id; renderStories(); }, id => !(STORIES[curTopic] && STORIES[curTopic][id])));
                storiesEl.appendChild(el('p', 'lvl-note', LEVELS.find(l => l[0] === curLevel)[1]));

                const s = STORIES[curTopic] && STORIES[curTopic][curLevel];
                if (!s) {
                    storiesEl.appendChild(el('p', 'empty', `لا توجد قصة في هذا الموضوع بمستوى ${curLevel} بعد. جرّب مستوى غير باهت.`));

                const card = el('article', 'story');

                s[2].forEach(([it, ar]) => {
                    const box = el('div', 'sp');
                    const p = el('p', 's-it', it); p.lang = 'it';

                    card.appendChild(box);
                });
                card.appendChild(el('h3', '', 'الكلمات المهمة'));
                const grid = el('div', 'vgrid');
                s[3].forEach(([w, m]) => {

                    v.append(b, el('span', '', m)); grid.appendChild(v);

            function setMode(m) {
                mode = m;
                const w = m === 'words';
                modeWords.setAttribute('aria-pressed', String(w));
                modeStories.setAttribute('aria-pressed', String(!w));
                searchInput.hidden = !w; tabsEl.hidden = !w; container.hidden = !w; storiesEl.hidden = w;
                syncPanel();
                if (w) applyFilters(); else { emptyMsg.hidden = true; renderStories(); }
                window.scrollTo(0, 0);
            }
            modeWords.addEventListener('click', () => setMode('words'));
            modeStories.addEventListener('click', () => setMode('stories'));

            const quizEl = document.getElementById('quiz');
            const tabsEl = document.querySelector('.tabs');
            let quiz = null;

            function shuffle(arr) {
                const r = [...arr];
                for (let i = r.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [r[i], r[j]] = [r[j], r[i]];
                }
                return r;
            }

            const meaningParts = m => m.split('/').map(s => normalize(s.trim()));

            function makeQuestion(item) {
                const used = new Set(meaningParts(item.meaning));
                const wrong = [];
                for (const o of shuffle(words)) {
                    if (o.word === item.word) continue;
                    const parts = meaningParts(o.meaning);
                    if (parts.some(p => used.has(p))) continue;
                    wrong.push(o.meaning);
                    parts.forEach(p => used.add(p));
                    if (wrong.length === 3) break;
                }
                return {
                    word: item.word,
                    correct: item.meaning,
                    options: shuffle([item.meaning, ...wrong])
                };
            }

            function setQuizMode(on) {
                container.hidden = on;
                searchInput.hidden = on;
                tabsEl.hidden = on;
                quizOn = on; syncPanel();
                quizEl.hidden = !on;
                if (on) emptyMsg.hidden = true;
                else applyFilters();
                window.scrollTo(0, 0);
            }

            function startQuiz(items) {
                quiz = {
                    items,
                    questions: shuffle(items).map(makeQuestion),
                    index: 0,
                    score: 0,
                    mistakes: []
                };
                setQuizMode(true);
                renderQuestion();
            }

            function renderQuestion() {
                const q = quiz.questions[quiz.index];
                const total = quiz.questions.length;
                quizEl.replaceChildren();

                const meta = el('div', 'quiz-meta');
                meta.appendChild(el('span', '', `سؤال ${quiz.index + 1} من ${total}`));
                const exit = el('button', 'quiz-exit', 'إنهاء');
                exit.type = 'button';
                exit.addEventListener('click', () => setQuizMode(false));
                meta.appendChild(exit);

                const bar = el('div', 'bar');
                const fill = document.createElement('i');
                fill.style.width = (quiz.index / total * 100) + '%';
                bar.appendChild(fill);

                const wordWrap = el('div', 'q-word-wrap');
                const wordEl = el('div', 'q-word', q.word);
                wordEl.lang = 'it';
                
                const speakBtn = el('button', 'btn-icon', '🔊');
                speakBtn.type = 'button';
                speakBtn.title = 'نطق الكلمة';
                speakBtn.addEventListener('click', () => speak(q.word));

                wordWrap.append(wordEl, speakBtn);

                const hint = el('p', 'q-hint', 'ما معنى هذه الكلمة؟');
                const feedback = el('p', 'feedback');
                const nextRow = el('div', 'next-row');
                const options = el('div', 'options');

                q.options.forEach(text => {
                    const b = el('button', 'opt', text);
                    b.type = 'button';
                    b.addEventListener('click', () => {
                        const ok = text === q.correct;
                        options.querySelectorAll('.opt').forEach(o => {
                            o.disabled = true;
                            if (o.textContent === q.correct) o.classList.add('right');
                        });
                        if (ok) {
                            quiz.score++;
                            feedback.textContent = 'إجابة صحيحة ✓';
                        } else {
                            b.classList.add('wrong');
                            feedback.textContent = 'إجابة خاطئة';
                            quiz.mistakes.push({ word: q.word, correct: q.correct, chosen: text });
                        }
                        const last = quiz.index === total - 1;
                        const next = el('button', 'btn-primary', last ? 'عرض النتيجة' : 'السؤال التالي');
                        next.type = 'button';
                        next.addEventListener('click', () => {
                            quiz.index++;
                            last ? renderResult() : renderQuestion();
                        });
                        nextRow.appendChild(next);
                        next.focus();
                    });
                    options.appendChild(b);
                });

                quizEl.append(meta, bar, wordWrap, hint, options, feedback, nextRow);
            }

            function renderResult() {
                const total = quiz.questions.length;
                const pct = Math.round(quiz.score / total * 100);
                quizEl.replaceChildren();

                const box = el('div', 'result');
                box.appendChild(el('p', 'score-big', `${quiz.score} / ${total}`));
                box.appendChild(el('p', 'score-sub', `النسبة ${pct}%`));
                box.appendChild(el('p', 'score-msg',
                    pct === 100 ? 'ممتاز! كل الإجابات صحيحة'
                    : pct >= 70 ? 'نتيجة جيدة، كمّل'
                    : pct >= 40 ? 'مقبول، راجع الكلمات الخاطئة'
                    : 'محتاج مراجعة أكتر، جرّب مرة ثانية'));

                const actions = el('div', 'result-actions');
                const again = el('button', 'btn-primary', 'إعادة الاختبار');
                again.type = 'button';
                again.addEventListener('click', () => startQuiz(quiz.items));
                actions.appendChild(again);

                if (quiz.mistakes.length) {
                    const retry = el('button', 'btn-ghost', 'اختبار الأخطاء فقط');
                    retry.type = 'button';
                    retry.addEventListener('click', () => {
                        const wrongWords = new Set(quiz.mistakes.map(m => m.word));
                        startQuiz(quiz.items.filter(i => wrongWords.has(i.word)));
                    });
                    actions.appendChild(retry);
                }

                const back = el('button', 'btn-ghost', 'رجوع للمحفوظات');
                back.type = 'button';
                back.addEventListener('click', () => setQuizMode(false));
                actions.appendChild(back);
                box.appendChild(actions);
                quizEl.appendChild(box);

                if (quiz.mistakes.length) {
                    const list = el('div', 'mistakes');
                    list.appendChild(el('h3', '', 'الكلمات التي أخطأت فيها'));
                    quiz.mistakes.forEach(m => {
                        const row = el('div', 'mistake');
                        const w = el('div', 'w', m.word);
                        w.lang = 'it';
                        const ok = el('div', 'ok', 'الصحيح: ' + m.correct);
                        const no = el('div', '');
                        no.append('إجابتك: ', el('span', 'no', m.chosen));
                        row.append(w, ok, no);
                        list.appendChild(row);
                    });
                    quizEl.appendChild(list);
                }
                window.scrollTo(0, 0);
            }

            startBtn.addEventListener('click', () => {
                const items = words.filter(w => saved.has(w.word));
                if (items.length) startQuiz(items);
            });

            tabAll.addEventListener('click', () => setTab(false));
            tabSaved.addEventListener('click', () => setTab(true));
            searchInput.addEventListener('input', applyFilters);

            applyFilters();
        });
    </script>
</body>

</html>
